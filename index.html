<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow the Precepts — The TRUTH Bible Study App</title>
  <meta name="description" content="Follow the Precepts — the TRUTH Bible Study App. Ask a question of the King James scriptures; answers come back precept upon precept, line upon line — tagged text, language, cross-reference, and flagged inference." />
  <meta name="author" content="Victor King" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Follow the Precepts — The TRUTH Bible Study App" />
  <meta property="og:description" content="Precept upon precept. Line upon line. Ask the King James scriptures and study the answer in four labeled layers." />
  <meta property="og:site_name" content="Follow the Precepts" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #1a1a1a;
      --ink-soft: #4a4a4a;
      --ink-faint: #8a8a8a;
      --paper: #ffffff;
      --paper-2: #f5f5f5;
      --rule: #e2e2e2;
      --accent: #0f1f3d;       /* deep navy */
      --accent-soft: #1c3257;
      --slate: #5a6b85;
      --error: #7a1f1f;
      --serif: "EB Garamond", Georgia, "Times New Roman", serif;
      --mono: "Courier Prime", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.12rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .wrap {
      width: 100%;
      max-width: 52rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ---- Header ---- */
    header {
      border-bottom: 1px solid var(--rule);
      padding: 2.4rem 0 2rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.05;
      margin: 0 0 0.5rem;
    }
    header .tagline {
      font-style: italic;
      color: var(--ink-soft);
      font-size: clamp(1.1rem, 2.6vw, 1.4rem);
      margin: 0;
    }

    /* ---- Chat ---- */
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .chat {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 2rem 0 0;
    }
    .messages {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-bottom: 1.5rem;
    }
    .msg { margin-bottom: 2rem; }

    .msg-role {
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.6rem;
    }

    /* User question */
    .msg.user .bubble {
      background: var(--paper-2);
      border: 1px solid var(--rule);
      border-left: 2px solid var(--accent);
      padding: 1rem 1.2rem;
      font-style: italic;
      font-size: 1.18rem;
    }

    /* Assistant four-layer answer */
    .layer {
      border: 1px solid var(--rule);
      border-top: none;
      padding: 1.1rem 1.3rem;
    }
    .layer:first-child {
      border-top: 1px solid var(--rule);
    }
    .layer-head {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 0.5rem;
    }
    .layer-tag {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--paper);
      background: var(--accent);
      padding: 0.12rem 0.5rem;
    }
    .layer[data-tag="L2"] .layer-tag { background: var(--accent-soft); }
    .layer[data-tag="L3"] .layer-tag { background: var(--slate); }
    .layer[data-tag="L4"] .layer-tag { background: var(--ink-soft); }
    .layer-name {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .layer-body {
      color: var(--ink-soft);
      white-space: pre-wrap;
    }

    /* Searching / error states */
    .msg .searching {
      border: 1px solid var(--rule);
      padding: 1.1rem 1.3rem;
      font-style: italic;
      color: var(--ink-faint);
    }
    .msg .engine-error {
      border: 1px solid var(--rule);
      border-left: 2px solid var(--error);
      padding: 1.1rem 1.3rem;
      color: var(--error);
    }

    .hint {
      color: var(--ink-faint);
      font-style: italic;
      text-align: center;
      padding: 1.5rem 0;
    }

    /* ---- Composer ---- */
    .composer {
      border-top: 1px solid var(--rule);
      background: var(--paper);
      padding: 1.2rem 0 1.4rem;
      position: sticky;
      bottom: 0;
    }
    .composer form {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1 1 auto;
      resize: none;
      font-family: var(--serif);
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--rule);
      padding: 0.75rem 0.9rem;
      max-height: 9rem;
    }
    .composer textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .composer button {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.8rem 1.4rem;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
      white-space: nowrap;
    }
    .composer button:hover {
      background: transparent;
      color: var(--accent);
    }
    .composer button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .composer button:disabled:hover {
      background: var(--accent);
      color: var(--paper);
    }

    /* ---- Footer ---- */
    footer {
      border-top: 1px solid var(--rule);
      text-align: center;
      padding: 1.6rem 0;
    }
    footer p {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0;
    }

    @media (max-width: 600px) {
      .composer button { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="wrap" style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <h1>Follow the Precepts</h1>
        <p class="tagline">Precept upon precept. Line upon line.</p>
      </div>
      <a href="/community" style="font-family:var(--mono);font-size:0.68rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:0.45rem 0.9rem;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s" onmouseover="this.style.background='var(--accent)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='var(--accent)'">Community</a>
    </div>
  </header>

  <main>
    <div class="wrap chat">
      <div class="messages" id="messages" aria-live="polite">
        <p class="hint" id="hint">
          Ask a question of the King James scriptures. Each answer is laid out
          precept upon precept — L1 the text, L2 the language, L3 the
          cross-reference, L4 flagged inference.
        </p>
      </div>
    </div>

    <div class="composer">
      <div class="wrap">
        <form id="ask-form">
          <textarea
            id="prompt"
            rows="1"
            placeholder="Ask the scriptures… e.g. “What does the Bible say about the Sabbath?”"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-btn">Search</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>Search the Scriptures Press &middot; Victor King &middot; Isaiah 28:10</p>
    </div>
  </footer>

  <script>
    const LAYERS = [
      { tag: "L1", name: "The Text" },
      { tag: "L2", name: "The Language" },
      { tag: "L3", name: "The Cross-Reference" },
      { tag: "L4", name: "Flagged Inference" },
    ];

    const messages = document.getElementById("messages");
    const hint = document.getElementById("hint");
    const form = document.getElementById("ask-form");
    const prompt = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    // Conversation history sent to the engine so follow-up questions keep context.
    const history = [];
    let pending = false;

    // Grow the textarea with its content.
    prompt.addEventListener("input", () => {
      prompt.style.height = "auto";
      prompt.style.height = prompt.scrollHeight + "px";
    });

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function scrollToEnd() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addUserMessage(text) {
      const msg = el("div", "msg user");
      msg.appendChild(el("div", "msg-role", "You ask"));
      const bubble = el("div", "bubble");
      bubble.textContent = text;
      msg.appendChild(bubble);
      messages.appendChild(msg);
    }

    // Split the engine reply into its labeled layers. The engine begins each
    // layer with its tag on its own line: [L1] … [L4]. If no tags are found,
    // the whole reply is shown as one block rather than lost.
    function parseLayers(reply) {
      const parts = reply.split(/^(?=\[L[1-4]\])/m);
      const found = {};
      let any = false;
      for (const part of parts) {
        const m = part.match(/^\[(L[1-4])\]\s*(?:TEXT|LANGUAGE|CROSS-REFERENCE|INFERENCE)?\s*[—–-]?\s*/i);
        if (!m) continue;
        const tag = m[1].toUpperCase();
        const body = part.slice(m[0].length).trim();
        if (body) { found[tag] = body; any = true; }
      }
      return any ? found : null;
    }

    function addAnswer(reply) {
      const msg = el("div", "msg assistant");
      msg.appendChild(el("div", "msg-role", "The scriptures answer"));

      const layers = parseLayers(reply);
      if (layers) {
        LAYERS.forEach((layer) => {
          if (!layers[layer.tag]) return;
          const block = el("div", "layer");
          block.dataset.tag = layer.tag;
          const head = el("div", "layer-head");
          head.appendChild(el("span", "layer-tag", layer.tag));
          head.appendChild(el("span", "layer-name", layer.name));
          block.appendChild(head);
          block.appendChild(el("div", "layer-body", layers[layer.tag]));
          msg.appendChild(block);
        });
      } else {
        const block = el("div", "layer");
        block.dataset.tag = "L1";
        block.appendChild(el("div", "layer-body", reply));
        msg.appendChild(block);
      }

      messages.appendChild(msg);
    }

    function addSearching() {
      const msg = el("div", "msg assistant");
      msg.appendChild(el("div", "msg-role", "The scriptures answer"));
      msg.appendChild(el("div", "searching", "Searching the scriptures…"));
      messages.appendChild(msg);
      return msg;
    }

    function showError(msg, text) {
      msg.innerHTML = "";
      msg.appendChild(el("div", "msg-role", "The engine"));
      msg.appendChild(el("div", "engine-error", text));
    }

    async function askEngine(question) {
      history.push({ role: "user", content: question });

      const waiting = addSearching();
      scrollToEnd();

      let streamMsg = null;
      let fullText = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          history.pop();
          showError(waiting, (data && data.error) || "The engine could not answer. Try again.");
          return;
        }

        // Replace the "searching" indicator with a live streaming block.
        waiting.remove();
        streamMsg = el("div", "msg assistant");
        streamMsg.appendChild(el("div", "msg-role", "The scriptures answer"));
        const streamBlock = el("div", "layer");
        streamBlock.dataset.tag = "L1";
        const streamText = el("div", "layer-body");
        streamBlock.appendChild(streamText);
        streamMsg.appendChild(streamBlock);
        messages.appendChild(streamMsg);
        scrollToEnd();

        // Consume the SSE stream from the server.
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split("\n");
          sseBuffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const raw = line.slice(5).trim();
            if (!raw || raw === "[DONE]") continue;
            try {
              const evt = JSON.parse(raw);
              if (
                evt.type === "content_block_delta" &&
                evt.delta &&
                evt.delta.type === "text_delta"
              ) {
                fullText += evt.delta.text;
                streamText.textContent = fullText;
                scrollToEnd();
              }
            } catch { /* skip malformed SSE events */ }
          }
        }

        // Stream complete — reformat the full text into labeled layers.
        history.push({ role: "assistant", content: fullText || "(No text returned.)" });
        streamMsg.remove();
        addAnswer(fullText || "(No text returned.)");

      } catch (err) {
        history.pop();
        if (streamMsg) {
          streamMsg.innerHTML = "";
          streamMsg.appendChild(el("div", "msg-role", "The engine"));
          streamMsg.appendChild(el("div", "engine-error", "Stream interrupted. Check your connection and try again."));
        } else {
          showError(waiting, "Could not reach the study engine. Check your connection and try again.");
        }
      } finally {
        pending = false;
        sendBtn.disabled = false;
        scrollToEnd();
        prompt.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (pending) return;
      const text = prompt.value.trim();
      if (!text) return;
      if (hint) hint.remove();

      pending = true;
      sendBtn.disabled = true;

      addUserMessage(text);
      prompt.value = "";
      prompt.style.height = "auto";
      scrollToEnd();

      askEngine(text);
    });
  </script>

  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
