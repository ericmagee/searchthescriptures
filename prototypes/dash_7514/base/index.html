<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>TRUTH App</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c232d;--line:#2a323d;--txt:#e6edf3;--mut:#9aa7b4;--teal:#2dd4bf;--gold:#e0b341;--red:#f87171;--green:#4ade80;--blue:#60a5fa;--violet:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 90px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-size:18px;margin:0}h1 span{color:var(--teal)}
.stamp{color:var(--mut);font-size:12px}.stamp b{color:var(--gold)}
.lockb{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--teal);color:#04201c;border-color:var(--teal);font-weight:700}
.search,select,textarea,input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 13px;font-size:15px;font-family:inherit;margin-bottom:10px}
.search:focus,select:focus,textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.row2{display:flex;gap:10px}.row2 select{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}.item:active{background:var(--panel2)}
.item .g{flex:1;min-width:0}.item .ttl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.t-teal{background:rgba(45,212,191,.14);color:var(--teal)}.t-gold{background:rgba(224,179,65,.14);color:var(--gold)}
.t-red{background:rgba(248,113,113,.16);color:var(--red)}.t-green{background:rgba(74,222,128,.14);color:var(--green)}
.t-blue{background:rgba(96,165,250,.14);color:var(--blue)}.t-violet{background:rgba(167,139,250,.15);color:var(--violet)}.t-mut{background:var(--panel2);color:var(--mut)}
.chev{color:var(--mut);font-size:18px}
.loading,.empty{color:var(--mut);text-align:center;padding:34px 10px}
#err{display:none;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--red);border-radius:10px;padding:12px;margin:10px 0;font-size:13px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}
.kpi .n{font-size:23px;font-weight:700}.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.part{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);background:var(--panel2);padding:7px 14px;border-bottom:1px solid var(--line)}
.verse{padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.verse:active{background:var(--panel2)}.verse b{color:var(--teal);font-size:12px;margin-right:6px;vertical-align:top}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.word{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px;cursor:pointer}
.word small{color:var(--gold);margin-left:4px}
.btn{background:var(--teal);color:#04201c;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.ans{white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;font-size:14.5px}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.turn .who{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:8px}
.turn .body{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.who-def{color:var(--teal)}.who-cha{color:var(--gold)}.who-syn{color:var(--violet)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:900px;max-height:88vh;overflow:auto;padding:18px 18px 44px}
@media(min-width:720px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:2px 0 4px;font-size:17px}
.sheet .meta{color:var(--mut);font-size:12.5px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.field{margin:14px 0}.field .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:4px;font-weight:600}
.field .val{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.strong{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.closeb{position:sticky;top:-18px;float:right;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.link{color:var(--blue);cursor:pointer;text-decoration:underline}
.gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.gatebox{max-width:360px;width:100%;text-align:center}
.gatebox h1{margin-bottom:6px}
</style>
</head>
<body>
<div class='gate' id='gate'><div class='gatebox'><h1>TRUTH App <span>Record</span></h1><p class='stamp'>Enter passphrase to continue.</p><input id='gpass' type='password' placeholder='Passphrase' autocomplete='off' onkeydown="if(event.key==='Enter')submitGate()"><button class='btn' onclick='submitGate()'>Enter</button><div id='gerr' class='stamp' style='color:var(--red);margin-top:8px'></div></div></div>
<div class='wrap' id='appwrap' style='display:none'>
<header><h1>TRUTH App <span>Record</span></h1><div style='display:flex;align-items:center;gap:10px'><div class='stamp' id='stamp'>...</div><button class='lockb' onclick='lock()'>Lock</button></div></header>
<div class='tabs' id='tabs'></div>
<div id='ctl'></div>
<div id='err'></div>
<div id='list'><div class='loading'>Loading...</div></div>
</div>
<div class='overlay' id='ov' onclick='if(event.target===this)closeSheet()'><div class='sheet' id='sheet'></div></div>
<script>
var BASE='https://bhffmkginddovmdcpnty.supabase.co/rest/v1/rpc/';
var OASK='https://bhffmkginddovmdcpnty.supabase.co/functions/v1/ask';
var KEY='sb_publishable_rgfWFjynRqBdzyEeBRHcig_c6pHysAi';
var PASS=sessionStorage.getItem('tad_pass')||'';
var ACT={'dashboard_json':'dashboard','dash_sights':'sights','dash_sight':'sight','dash_conclusions':'conclusions','dash_conclusion':'conclusion','dash_tensions':'tensions','dash_todos':'todos','dash_guards':'guards','dash_journal':'journal','dash_journal_entry':'journal_entry','dash_search':'search','dash_books':'books','dash_chapter':'chapter','dash_verse_words':'verse_words','dash_strongs':'strongs','dash_verse_search':'verse_search','dash_ms_books':'ms_books','dash_ms_chapters':'ms_chapters','dash_ms_chapter':'ms_chapter','dash_launch_debate':'launch_debate','get_debate_status':'debate_status','dash_debate_result':'debate_result'};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function rpc(fn,args){return fetch(BASE+'dash_api',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pass:PASS,p_action:(ACT[fn]||fn),p_arg:args||{}})}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,140));});return r.json();}).then(function(d){if(d&&d.error==='unauthorized'){lock();throw new Error('Locked — re-enter passphrase.');}return d;});}
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function clrErr(){document.getElementById('err').style.display='none';}
function showGate(){document.getElementById('gate').style.display='flex';document.getElementById('appwrap').style.display='none';var e=document.getElementById('gpass');if(e){e.value='';setTimeout(function(){e.focus();},50);}}
function hideGate(){document.getElementById('gate').style.display='none';document.getElementById('appwrap').style.display='block';}
function submitGate(){var p=document.getElementById('gpass').value.trim();if(!p)return;var ge=document.getElementById('gerr');ge.textContent='Checking...';fetch(BASE+'dash_api',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pass:p,p_action:'dashboard',p_arg:{}})}).then(function(r){return r.json();}).then(function(d){if(d&&d.error){ge.textContent='Wrong passphrase.';return;}PASS=p;sessionStorage.setItem('tad_pass',p);ge.textContent='';hideGate();renderTabs();setupCtl();loadTab();}).catch(function(e){ge.textContent='Error: '+e.message;});}
function lock(){PASS='';sessionStorage.removeItem('tad_pass');if(window.__dpoll){clearInterval(window.__dpoll);window.__dpoll=null;}if(window.__ccpoll){clearInterval(window.__ccpoll);window.__ccpoll=null;}showGate();}
var TABS=[['overview','Overview'],['scripture','Scripture'],['ask','Ask'],['debate','Debate'],['challenger','Challenger'],['search','Search'],['sights','Sights'],['conclusions','Conclusions'],['tensions','Tensions'],['todos','Todos'],['guards','Guards'],['journal','Journal'],['books','Books']];
var cur='overview';var booksList=null;
function prio(p){p=(p||'').toLowerCase();if(p==='critical')return 't-red';if(p==='high')return 't-gold';if(p==='medium')return 't-blue';return 't-mut';}
function stat(s){s=(s||'').toUpperCase();if(s.indexOf('DONE')>-1||s.indexOf('ESTABLISH')>-1||s.indexOf('SEALED')>-1||s.indexOf('CLOSED')>-1)return 't-green';if(s.indexOf('OPEN')>-1)return 't-blue';if(s.indexOf('SUPPORT')>-1)return 't-violet';if(s.indexOf('PENDING')>-1||s.indexOf('BLOCK')>-1)return 't-gold';return 't-mut';}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<div class="tab'+(t[0]===cur?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</div>';}).join('');}
function go(t){if(window.__dpoll){clearInterval(window.__dpoll);window.__dpoll=null;}if(window.__ccpoll){clearInterval(window.__ccpoll);window.__ccpoll=null;}cur=t;renderTabs();document.getElementById('ctl').innerHTML='';clrErr();setupCtl();document.getElementById('list').innerHTML='<div class="loading">Loading...</div>';loadTab();}
function qv(){var e=document.getElementById('q1');return e?e.value.trim():'';}
function deb(){clearTimeout(window.__d);window.__d=setTimeout(loadTab,300);}
function si(ph){return '<input class="search" id="q1" placeholder="'+ph+'" oninput="deb()" autocomplete="off">';}
function setupCtl(){var c=document.getElementById('ctl');if(cur==='sights')c.innerHTML=si('Search sights');else if(cur==='conclusions')c.innerHTML=si('Search conclusions');else if(cur==='journal')c.innerHTML=si('Search journal');else if(cur==='guards')c.innerHTML=si('Filter guards');}
function item(type,id,ttl,sub,right){return '<div class="item" onclick="openItem(\''+type+'\','+JSON.stringify(id)+')"><div class="g"><span class="ttl">'+ttl+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'+(right||'')+'<span class="chev">&rsaquo;</span></div>';}
function empty(){return '<div class="empty">Nothing here.</div>';}
function listHTML(h){document.getElementById('list').innerHTML=h;}
function fail(e){showErr('Load failed: '+e.message);listHTML('');}
function loadTab(){clrErr();
 if(cur==='overview')return rpc('dashboard_json').then(function(d){document.getElementById('stamp').innerHTML='Live &middot; <b>'+esc(d.stamp)+' CDT</b>';var k=d.kpis||{};var kpi=function(n,l){return '<div class="kpi"><div class="n">'+esc(n)+'</div><div class="l">'+l+'</div></div>';};listHTML('<div class="ovgrid">'+kpi(k.next_sight,'Next sight')+kpi(k.sights,'Sights')+kpi(k.guards,'Guards')+kpi(k.tensions,'Tensions')+kpi(k.open_todos,'Open todos')+kpi(k.journal_max,'Journal')+'</div><div class="card">'+(d.criticals||[]).map(function(c){return '<div class="item" onclick="go(\'todos\')"><div class="g"><span class="ttl">'+esc(c.title)+'</span><span class="sub">critical todo #'+c.id+'</span></div><span class="tag t-red">Critical</span></div>';}).join('')+'</div>');}).catch(fail);
 if(cur==='scripture')return renderScripture();
 if(cur==='ask')return renderAsk();
 if(cur==='debate')return renderDebate();
 if(cur==='challenger')return renderChallenger();
 if(cur==='search')return renderSearch();
 if(cur==='books')return rpc('dash_ms_books').then(function(rows){listHTML(rows.map(function(b){return item('msbook',b.id,esc(b.title||''),esc((b.subtitle||'')),'<span class="tag t-mut">'+(b.chapters||'')+' ch</span>');}).join(''));}).catch(fail);
 if(cur==='sights')return rpc('dash_sights',{q:qv(),lim:80}).then(function(rows){listHTML(rows.length?rows.map(function(s){return item('sight',s.sight_number,'#'+s.sight_number+' '+esc(s.title||''),esc(s.passage||s.topic||''),'<span class="tag '+stat(s.status)+'">'+esc(s.layer||s.status)+'</span>');}).join(''):empty());}).catch(fail);
 if(cur==='conclusions')return rpc('dash_conclusions',{q:qv(),lim:80}).then(function(rows){listHTML(rows.length?rows.map(function(c){return item('conclusion',c.id,esc(c.snippet||''),esc((c.passage||'')+(c.layer?(' &middot; '+c.layer):'')),'<span class="tag '+stat(c.status)+'">'+esc(c.status||'')+'</span>');}).join(''):empty());}).catch(fail);
 if(cur==='tensions')return rpc('dash_tensions').then(function(rows){window.__ten=rows;listHTML(rows.map(function(t){return item('tension',t.id,esc(t.item||''),'tid '+t.id+' &middot; '+esc(t.updated||''),'<span class="tag '+stat(t.status)+'">'+esc(t.status||'')+'</span>');}).join(''));}).catch(fail);
 if(cur==='todos')return rpc('dash_todos').then(function(rows){window.__todo=rows;listHTML(rows.map(function(t){return item('todo',t.id,'#'+t.id+' '+esc(t.title||''),esc(t.category||''),'<span class="tag '+prio(t.priority)+'">'+esc(t.priority||'')+'</span>');}).join(''));}).catch(fail);
 if(cur==='guards'){var rg=function(){var q=qv().toLowerCase();var rows=window.__guardAll.filter(function(g){return !q||(String(g.subject||'')+' '+String(g.rule||'')).toLowerCase().indexOf(q)>-1;});window.__guard=rows;listHTML(rows.length?rows.map(function(g){return item('guard',g.rule_num,'DG-'+g.rule_num+' '+esc(g.subject||''),'','<span class="tag '+prio(g.priority)+'">'+esc(g.priority||'')+'</span>');}).join(''):empty());};if(window.__guardAll)return Promise.resolve().then(rg);return rpc('dash_guards').then(function(r){window.__guardAll=r;rg();}).catch(fail);}
 if(cur==='journal')return rpc('dash_journal',{q:qv(),lim:60}).then(function(rows){listHTML(rows.length?rows.map(function(j){return item('journal',j.entry_num,'#'+j.entry_num+' '+esc(j.title||'(untitled)'),esc(j.date||''),'');}).join(''):empty());}).catch(fail);
}
function renderDebate(){document.getElementById('ctl').innerHTML='<input id="dtopic" placeholder="Debate topic" autocomplete="off"><div class="row2"><select id="deng"><option value="deepseek">DeepSeek</option><option value="chatgpt">ChatGPT</option><option value="gemini">Gemini</option><option value="grok">Grok</option></select><select id="drounds"><option value="2">2 rounds</option><option value="3" selected>3 rounds</option><option value="4">4 rounds</option></select></div><button class="btn" id="dbtn" onclick="launchDebate()">Launch debate</button>';listHTML('<p class="stamp">Claude defends the position through the four-layer method; the engine you pick challenges it. Runs on your n8n engine and can take a couple minutes. Saved to debate_results.</p>');}
function launchDebate(){var topic=document.getElementById('dtopic').value.trim();if(topic.length<6){showErr('Give a fuller topic.');return;}clrErr();var eng=document.getElementById('deng').value;var rounds=parseInt(document.getElementById('drounds').value);var b=document.getElementById('dbtn');b.disabled=true;b.textContent='Launching...';rpc('dash_launch_debate',{p_topic:topic,p_engine:eng,p_rounds:rounds}).then(function(res){if(res.status!=='queued'){showErr('Debate: '+(res.message||res.status));b.disabled=false;b.textContent='Launch debate';return;}window.__dtopic=topic;window.__dtoken=res.queue_token;listHTML('<div class="loading">Debate queued — challenger: '+esc(res.engine)+'. Running the rounds, can take a couple minutes...</div>');startPoll();}).catch(function(e){showErr('Launch failed: '+e.message);b.disabled=false;b.textContent='Launch debate';});}
function startPoll(){if(window.__dpoll)clearInterval(window.__dpoll);window.__dpoll=setInterval(pollDebate,6000);pollDebate();}
function pollDebate(){rpc('get_debate_status',{p_token:window.__dtoken}).then(function(s){var b=document.getElementById('dbtn');if(s.status==='complete'){if(window.__dpoll){clearInterval(window.__dpoll);window.__dpoll=null;}if(b){b.disabled=false;b.textContent='Launch debate';}showTranscript(window.__dtopic);}else if(s.status==='failed'||s.status==='error'||s.error_message){if(window.__dpoll){clearInterval(window.__dpoll);window.__dpoll=null;}if(b){b.disabled=false;b.textContent='Launch debate';}showErr('Debate failed: '+esc(s.error_message||s.status));listHTML('');}else{listHTML('<div class="loading">Status: '+esc(s.status||'working')+(s.position>1?(' &middot; '+s.position+' ahead'):'')+'...<br><span class="stamp">polling every 6s</span></div>');}}).catch(function(e){});}
function turn(who,cls,body){if(!body)return '';return '<div class="turn"><div class="who '+cls+'">'+who+'</div><div class="body">'+esc(body)+'</div></div>';}
function showTranscript(topic){listHTML('<div class="loading">Loading transcript...</div>');rpc('dash_debate_result',{p_topic:topic}).then(function(d){if(!d){listHTML('<div class="empty">Completed, but transcript row not landed yet. Reopen the Debate tab in a moment.</div>');return;}var eng=(d.engine||'engine');var h='<div class="h2">'+esc(d.topic||topic)+'</div>';h+=turn('Defender — Claude · R1','who-def',d.claude_r1);h+=turn('Challenger — '+esc(eng)+' · R1','who-cha',d.engine_r1);h+=turn('Defender — Claude · R2','who-def',d.claude_r2);h+=turn('Challenger — '+esc(eng)+' · R2','who-cha',d.engine_r2);h+=turn('Synthesis','who-syn',d.synthesis);h+=turn('Framework verdict','who-syn',d.framework_verdict);h+=turn('Independent verdict','who-syn',d.independent_verdict_raw);listHTML(h);}).catch(fail);}
function ccEng(e){return ({gemini:'Gemini',grok:'Grok',deepseek:'DeepSeek',chatgpt:'ChatGPT'})[e]||e;}
function renderChallenger(){document.getElementById('ctl').innerHTML='<input id="cctopic" placeholder="Debate topic" autocomplete="off"><div class="row2"><select id="cceng"><option value="gemini">Gemini defends</option><option value="grok">Grok defends</option><option value="deepseek">DeepSeek defends</option><option value="chatgpt">ChatGPT defends</option></select></div><button class="btn" id="ccbtn" onclick="launchCC()">Launch challenger debate</button>';return loadCCList('<p class="stamp">Seat inversion (W1_CC): the engine you pick DEFENDS the standard reading; Claude goes second as CHALLENGER pressing the framework&#39;s chain. Judge and analyst are non-combatants. Runs 5&ndash;9 minutes; saved to debate_results.</p>');}
function loadCCList(prefix){return rpc('cc_debates').then(function(rows){var h=(prefix||'');if(rows&&rows.length){h+='<div class="h2">Recent challenger debates</div><div class="card">'+rows.map(function(r){var d=(r.created_at||'').slice(0,16).replace('T',' ');var ds=String(r.defense_standing||'').toUpperCase();var dsTag=ds?'<span class="tag '+(ds==='SELF-SUPPORTED'?'t-green':(ds==='COLLAPSED'?'t-red':'t-gold'))+'">DEF: '+esc(ds)+(r.conceded_links==null?'':' &middot; '+r.conceded_links+' conceded')+'</span>':'';return '<div class="item" onclick="ccOpen(\''+r.id+'\')"><div class="g"><span class="ttl">'+esc(r.topic||'')+'</span><span class="sub">'+ccEng(r.engine)+' defends &middot; '+esc(d)+'</span></div><span class="tag '+(String(r.framework_verdict||'').toUpperCase()==='HELD'?'t-green':(String(r.framework_verdict||'').toUpperCase()==='BROKEN'?'t-red':'t-gold'))+'">FW: '+esc(r.framework_verdict||'?')+'</span>'+dsTag+'<span class="chev">&rsaquo;</span></div>';}).join('')+'</div>';}else{h+=empty();}listHTML(h);return rows;}).catch(fail);}
function launchCC(){var topic=document.getElementById('cctopic').value.trim();if(topic.length<6){showErr('Give a fuller topic.');return;}clrErr();var eng=document.getElementById('cceng').value;var b=document.getElementById('ccbtn');b.disabled=true;b.textContent='Launching...';rpc('launch_cc',{p_topic:topic,p_engine:eng}).then(function(res){if(res.status!=='fired'){showErr('Launch: '+(res.message||res.status));b.disabled=false;b.textContent='Launch challenger debate';return;}window.__cctopic=topic.toLowerCase();window.__ccsince=Date.now();window.__ccn=0;listHTML('<div class="loading">Fired — '+ccEng(res.engine)+' defends, Claude challenges.<br>W1_CC runs 5&ndash;9 minutes; this page checks for the result every 30s.</div>');if(window.__ccpoll)clearInterval(window.__ccpoll);window.__ccpoll=setInterval(ccPoll,30000);}).catch(function(e){showErr('Launch failed: '+e.message);b.disabled=false;b.textContent='Launch challenger debate';});}
function ccPoll(){window.__ccn=(window.__ccn||0)+1;rpc('cc_debates').then(function(rows){var hit=(rows||[]).find(function(r){return String(r.topic||'').trim().toLowerCase()===window.__cctopic&&new Date(r.created_at).getTime()>window.__ccsince-60000;});var b=document.getElementById('ccbtn');if(hit){if(window.__ccpoll){clearInterval(window.__ccpoll);window.__ccpoll=null;}if(b){b.disabled=false;b.textContent='Launch challenger debate';}ccOpen(hit.id);}else if(window.__ccn>24){if(window.__ccpoll){clearInterval(window.__ccpoll);window.__ccpoll=null;}if(b){b.disabled=false;b.textContent='Launch challenger debate';}showErr('No result after 12 minutes — check n8n executions; the run may have failed (see debate_errors).');loadCCList();}else{listHTML('<div class="loading">Still running... check '+window.__ccn+' of 24<br><span class="stamp">checking every 30s</span></div>');}}).catch(function(e){});}
function ccOpen(id){var sh=document.getElementById('sheet');sh.innerHTML='<div class="loading">Loading transcript...</div>';document.getElementById('ov').classList.add('on');rpc('debate_by_id',{p_id:id}).then(function(d){if(!d){sh.innerHTML='<button class="closeb" onclick="closeSheet()">&times;</button><p>Not found.</p>';return;}var eng=ccEng(d.engine);var h='<button class="closeb" onclick="closeSheet()">&times;</button><h3>'+esc(d.topic||'')+'</h3><div class="meta"><span class="tag t-teal">'+esc(eng)+' defends</span><span class="tag t-gold">Claude challenges</span><span class="tag '+(String(d.framework_verdict||'').toUpperCase()==='HELD'?'t-green':'t-gold')+'">FW: '+esc(d.framework_verdict||'')+'</span>'+(d.defense_standing?'<span class="tag '+(String(d.defense_standing).toUpperCase()==='SELF-SUPPORTED'?'t-green':(String(d.defense_standing).toUpperCase()==='COLLAPSED'?'t-red':'t-gold'))+'">DEF: '+esc(d.defense_standing)+'</span>':'')+'<span class="tag t-mut">'+esc((d.created_at||'').slice(0,16).replace('T',' '))+'</span></div>';h+=turn('Defender — '+esc(eng)+' (standard reading) · R1','who-def',d.engine_r1);h+=turn('Challenger — Claude · R1','who-cha',d.claude_r1);h+=turn('Defender — '+esc(eng)+' · R2','who-def',d.engine_r2);h+=turn('Challenger — Claude · R2 (ends with UNSTATED PREMISES)','who-cha',d.claude_r2);if(d.engine_r3)h+=turn('Defender — '+esc(eng)+' · R3 LINK ROUND (cite-or-concede)','who-def',d.engine_r3);h+=turn('Synthesis (analyst)','who-syn',d.synthesis);h+=turn('Framework Status — challenger&#39;s chain','who-syn',d.framework_verdict);h+=turn('Defense Standing — defender','who-syn',(d.defense_standing||'UNGRADED')+(d.conceded_links==null?'':' — conceded links: '+d.conceded_links));h+=turn('Independent verdict (judge)','who-syn',d.independent_verdict_raw);sh.innerHTML=h;}).catch(sheetFail);}
function renderScripture(){var build=function(){var opts=booksList.map(function(b){return '<option value="'+esc(b.book)+'" data-ch="'+b.chapters+'">'+esc(b.book)+'</option>';}).join('');document.getElementById('ctl').innerHTML='<input class="search" id="vs" placeholder="Search KJV text" oninput="vsdeb()" autocomplete="off"><div class="row2"><select id="bk" onchange="chapOpts()">'+opts+'</select><select id="ch"></select></div>';chapOpts();};if(booksList)return Promise.resolve().then(build);return rpc('dash_books').then(function(r){booksList=r;build();}).catch(fail);}
function vsdeb(){clearTimeout(window.__vd);window.__vd=setTimeout(function(){var q=document.getElementById('vs').value.trim();if(q.length>=2)verseSearch(q);else loadChapter();},300);}
function verseSearch(q){listHTML('<div class="loading">Searching...</div>');rpc('dash_verse_search',{q:q,lim:80}).then(function(vs){listHTML('<div class="card" style="padding:6px 14px">'+(vs.length?vs.map(function(v){return verseRow(v.book,v.chapter,v.verse,v.text,v.ref);}).join(''):'<div class="empty">No verses.</div>')+'</div>');}).catch(fail);}
function chapOpts(){var bk=document.getElementById('bk');var n=parseInt(bk.options[bk.selectedIndex].getAttribute('data-ch'))||1;var o='';for(var i=1;i<=n;i++)o+='<option value="'+i+'">'+i+'</option>';var ch=document.getElementById('ch');ch.innerHTML=o;ch.onchange=loadChapter;if(!document.getElementById('vs').value.trim())loadChapter();}
function loadChapter(){var bk=document.getElementById('bk').value;var ch=parseInt(document.getElementById('ch').value);listHTML('<div class="loading">Loading...</div>');rpc('dash_chapter',{p_book:bk,p_chap:ch}).then(function(vs){listHTML('<div class="card" style="padding:6px 14px">'+vs.map(function(v){return verseRow(bk,ch,v.v,v.text,null);}).join('')+'</div>');}).catch(fail);}
function verseRow(bk,ch,v,text,ref){return '<div class="verse" data-b="'+esc(bk)+'" data-c="'+ch+'" data-v="'+v+'" onclick="vw(this)"><b>'+(ref?esc(ref):v)+'</b>'+esc(text)+'<div class="words"></div></div>';}
function vw(el){var box=el.querySelector('.words');if(el.getAttribute('data-open')==='1'){box.innerHTML='';el.setAttribute('data-open','0');return;}el.setAttribute('data-open','1');box.innerHTML='<span class="sub">loading...</span>';rpc('dash_verse_words',{p_book:el.getAttribute('data-b'),p_chap:parseInt(el.getAttribute('data-c')),p_verse:parseInt(el.getAttribute('data-v'))}).then(function(ws){box.innerHTML=ws.map(function(w){return '<span class="word" onclick="event.stopPropagation();strongs(\''+(w.strongs||'')+'\')">'+esc(w.word)+(w.strongs?'<small>'+esc(w.strongs)+'</small>':'')+'</span>';}).join('');}).catch(function(e){box.innerHTML='<span class="sub">'+esc(e.message)+'</span>';});}
function strongs(code){if(!code)return;var codes=code.split('+');var sh=document.getElementById('sheet');sh.innerHTML='<div class="loading">Loading...</div>';document.getElementById('ov').classList.add('on');Promise.all(codes.map(function(c){return rpc('dash_strongs',{p_code:c});})).then(function(res){var h='<button class="closeb" onclick="closeSheet()">&times;</button><h3>'+esc(code)+'</h3>';res.forEach(function(d){var lx=d.lex||{};h+='<div class="strong"><div style="font-weight:700">'+esc(d.strongs)+' '+esc(lx.original_script||'')+'</div><div class="meta" style="margin:6px 0">'+(lx.language?'<span class="tag t-teal">'+esc(lx.language)+'</span>':'')+(lx.transliteration?'<span class="tag t-mut">'+esc(lx.transliteration)+'</span>':'')+'<span class="tag t-mut">'+d.occurrences+' occ</span></div>'+(lx.anchor_gloss?'<div class="val">'+esc(lx.anchor_gloss)+'</div>':'<div class="sub">no lexicon gloss</div>')+'</div>';});sh.innerHTML=h;}).catch(sheetFail);}
function renderAsk(){document.getElementById('ctl').innerHTML='<textarea id="q" rows="3" placeholder="Ask a study question..."></textarea><button class="btn" id="askb" onclick="doAsk()">Ask the Oracle</button>';listHTML('<p class="stamp">Answers come from your live ask edge function. A few seconds; rate-limited.</p>');}
function doAsk(){var q=document.getElementById('q').value.trim();if(q.length<8){showErr('Type a fuller question.');return;}clrErr();var b=document.getElementById('askb');b.disabled=true;b.textContent='Thinking...';listHTML('<div class="loading">The Oracle is working...</div>');fetch(OASK,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,st:r.status,j:j};});}).then(function(res){b.disabled=false;b.textContent='Ask the Oracle';if(!res.ok){showErr('Oracle: '+(res.j&&res.j.error?res.j.error:('HTTP '+res.st)));listHTML('');return;}var j=res.j;var cov=j.coverage||j.coverage_grade||'';listHTML('<div class="meta" style="margin-bottom:0">'+(cov?'<span class="tag t-teal">coverage '+esc(cov)+'</span>':'')+(j.grounding_flag&&j.grounding_flag!=='ok'?'<span class="tag t-gold">'+esc(j.grounding_flag)+'</span>':'')+'</div><div class="ans">'+esc(j.answer||'(no answer)')+'</div>');}).catch(function(e){b.disabled=false;b.textContent='Ask the Oracle';showErr('Oracle failed: '+e.message);listHTML('');});}
function renderSearch(){document.getElementById('ctl').innerHTML='<input class="search" id="sq" placeholder="Search sights, conclusions, tensions, journal..." autocomplete="off">';document.getElementById('sq').addEventListener('input',function(){clearTimeout(window.__st);window.__st=setTimeout(doSearch,300);});listHTML('<p class="stamp">Type to search across the whole record.</p>');}
function doSearch(){var q=document.getElementById('sq').value.trim();if(q.length<2){listHTML('<p class="stamp">Type to search across the whole record.</p>');return;}rpc('dash_search',{q:q}).then(function(d){var h='';function sec(t){return '<div class="h2">'+t+'</div>';}if((d.sights||[]).length){h+=sec('Sights')+'<div class="card">'+d.sights.map(function(s){return item('sight',s.sight_number,'#'+s.sight_number+' '+esc(s.title||''),esc(s.passage||''),'<span class="tag '+stat(s.status)+'">'+esc(s.layer||s.status)+'</span>');}).join('')+'</div>';}if((d.conclusions||[]).length){h+=sec('Conclusions')+'<div class="card">'+d.conclusions.map(function(c){return item('conclusion',c.id,esc(c.snippet||''),esc((c.passage||'')+' &middot; '+(c.layer||'')),'<span class="tag '+stat(c.status)+'">'+esc(c.status||'')+'</span>');}).join('')+'</div>';}if((d.tensions||[]).length){window.__ten=d.tensions;h+=sec('Tensions')+'<div class="card">'+d.tensions.map(function(t){return item('tension',t.id,esc(t.item||''),'tid '+t.id,'<span class="tag '+stat(t.status)+'">'+esc(t.status||'')+'</span>');}).join('')+'</div>';}if((d.journal||[]).length){h+=sec('Journal')+'<div class="card">'+d.journal.map(function(j){return item('journal',j.entry_num,'#'+j.entry_num+' '+esc(j.title||''),esc(j.date||''),'');}).join('')+'</div>';}listHTML(h||empty());}).catch(fail);}
function fld(l,v){if(v==null||v==='')return '';return '<div class="field"><div class="lab">'+l+'</div><div class="val">'+esc(v)+'</div></div>';}
function closeSheet(){document.getElementById('ov').classList.remove('on');}
function sheetFail(e){document.getElementById('sheet').innerHTML='<button class="closeb" onclick="closeSheet()">&times;</button><p style="color:var(--red)">Load failed: '+esc(e.message)+'</p>';}
function openItem(type,id){var sh=document.getElementById('sheet');sh.innerHTML='<div class="loading">Loading...</div>';document.getElementById('ov').classList.add('on');var C='<button class="closeb" onclick="closeSheet()">&times;</button>';
 if(type==='sight')return rpc('dash_sight',{n:id}).then(function(d){if(!d){sh.innerHTML=C+'<p>Not found.</p>';return;}sh.innerHTML=C+'<h3>#'+d.sight_number+' '+esc(d.title||'')+'</h3><div class="meta"><span class="tag '+stat(d.status)+'">'+esc(d.status||'')+'</span><span class="tag t-teal">'+esc(d.layer||'')+'</span>'+(d.passage?'<span class="tag t-mut">'+esc(d.passage)+'</span>':'')+'</div>'+fld('Topic',d.topic)+fld('Framework area',d.framework_area)+fld('Summary',d.summary)+fld('Notes',d.notes);}).catch(sheetFail);
 if(type==='tension'){var t=(window.__ten||[]).find(function(x){return x.id===id;})||{};sh.innerHTML=C+'<h3>'+esc(t.item||'')+'</h3><div class="meta"><span class="tag '+stat(t.status)+'">'+esc(t.status||'')+'</span><span class="tag t-mut">tid '+id+'</span>'+(t.updated?'<span class="tag t-mut">'+esc(t.updated)+'</span>':'')+'</div>'+fld('Anchor',t.anchor)+fld('Notes',t.notes);return;}
 if(type==='todo'){var td=(window.__todo||[]).find(function(x){return x.id===id;})||{};sh.innerHTML=C+'<h3>#'+id+' '+esc(td.title||'')+'</h3><div class="meta"><span class="tag '+prio(td.priority)+'">'+esc(td.priority||'')+'</span><span class="tag '+stat(td.status)+'">'+esc(td.status||'')+'</span></div>'+fld('Description',td.description)+fld('Notes',td.notes);return;}
 if(type==='guard'){var g=(window.__guard||[]).find(function(x){return x.rule_num===id;})||{};sh.innerHTML=C+'<h3>DG-'+id+' '+esc(g.subject||'')+'</h3><div class="meta"><span class="tag '+prio(g.priority)+'">'+esc(g.priority||'')+'</span></div>'+fld('Rule',g.rule)+fld('Anchors',Array.isArray(g.anchors)?g.anchors.join(', '):g.anchors);return;}
 if(type==='journal')return rpc('dash_journal_entry',{n:id}).then(function(d){if(!d){sh.innerHTML=C+'<p>Not found.</p>';return;}sh.innerHTML=C+'<h3>#'+d.entry_num+' '+esc(d.title||'')+'</h3><div class="meta">'+(d.date?'<span class="tag t-mut">'+esc(d.date)+'</span>':'')+(Array.isArray(d.tags)?d.tags.map(function(x){return '<span class="tag t-teal">'+esc(x)+'</span>';}).join(''):'')+'</div>'+fld('What happened',d.what_happened)+fld('What shifted',d.what_shifted)+fld('What it means',d.what_means)+fld('Closing',d.closing_words)+fld('Anchors',Array.isArray(d.anchors)?d.anchors.join(', '):d.anchors);}).catch(sheetFail);
 if(type==='conclusion')return rpc('dash_conclusion',{id:id}).then(function(d){if(!d){sh.innerHTML=C+'<p>Not found.</p>';return;}sh.innerHTML=C+'<h3>Conclusion #'+d.id+'</h3><div class="meta"><span class="tag '+stat(d.status)+'">'+esc(d.status||'')+'</span><span class="tag t-teal">'+esc(d.layer||'')+'</span>'+(d.passage_anchor?'<span class="tag t-mut">'+esc(d.passage_anchor)+'</span>':'')+'</div>'+fld('Conclusion',d.conclusion_text)+fld('Hebrew / Greek',d.hebrew_greek)+(d.sight_ref?'<div class="field"><div class="lab">Sight</div><div class="val"><span class="link" onclick="openItem(\'sight\','+d.sight_ref+')">Open sight #'+d.sight_ref+'</span></div></div>':'');}).catch(sheetFail);
 if(type==='msbook')return rpc('dash_ms_chapters',{p_book_id:id}).then(function(rows){var h=C+'<h3>Chapters</h3><div class="card" style="margin-top:10px">';var lastPart=null;rows.forEach(function(c){var p=c.part||'';if(p!==lastPart){lastPart=p;if(p)h+='<div class="part">'+esc(p)+'</div>';}h+='<div class="item" onclick="openItem(\'mschap\','+c.id+')"><div class="g"><span class="ttl">'+esc(c.label||('#'+c.ord))+'</span><span class="sub">'+esc(c.title||'')+(c.words?(' &middot; '+c.words+' words'):'')+'</span></div><span class="chev">&rsaquo;</span></div>';});h+='</div>';sh.innerHTML=h;}).catch(sheetFail);
 if(type==='mschap')return rpc('dash_ms_chapter',{p_id:id}).then(function(d){if(!d){sh.innerHTML=C+'<p>Not found.</p>';return;}sh.innerHTML=C+'<h3>'+esc(d.chapter_label||d.title||'')+'</h3><div class="meta">'+(d.title?'<span class="tag t-mut">'+esc(d.title)+'</span>':'')+(d.word_count?'<span class="tag t-mut">'+d.word_count+' words</span>':'')+'</div><div class="field"><div class="val">'+esc(d.content)+'</div></div>';}).catch(sheetFail);
}
function boot(){if(PASS){hideGate();renderTabs();setupCtl();loadTab();}else{showGate();}}
</script>
